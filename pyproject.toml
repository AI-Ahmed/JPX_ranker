[project]
name = "jpx-ranker"
version = "0.1.0"
description = "JPX Tokyo Stock Exchange Prediction - Ranking Model"
requires-python = ">=3.10"
dependencies = [
    # Data manipulation and analysis
    # Constrained to work with Kaggle's Python 3.10 and pre-installed ML stack
    "pandas>=2.1.0",
    "numpy>=1.24.0,<2.0.0",
    
    # Environment variables
    "python-dotenv>=1.0.0",
    
    # Kaggle integration
    "kaggle>=1.6.0",
    "kagglehub>=0.3.0",
    
    # Parallel processing
    "pandarallel",
    "feather-format",
    
    # Progress bars
    "tqdm",
    
    # Statistical analysis
    "statsmodels>=0.14.0",
    
    # Machine learning
    "scikit-learn>=1.5.0",
    "lightgbm",
    "xgboost",
    "catboost",
    "optuna",
    
    # Visualization
    # Constrained to work with ydata-profiling
    "matplotlib>=3.7.0,<3.9",
    "seaborn>=0.12.0,<0.13",
    
    # Data serialization
    "pyarrow>=14.0.0",
    
    # Portfolio optimization
    "skfolio>=0.15.3",
    
    # Logging
    "loguru",
    
    # Compatibility constraints for Kaggle environment
    "protobuf>=3.20.0,<5.0.0",
    "dill>=0.3.1.1,<0.4.0",
    "urllib3>=1.25.4,<2.1",
    "scipy>=1.11.0,<1.14.0",
    "packaging>=21.3",
]

[project.optional-dependencies]
dev = [
    # Jupyter notebook support
    # Note: In Kaggle notebooks, these are pre-installed
    # Only install locally for development
    "ipykernel>=6.25.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0,<4.0.0",  # Constrained for beatrix-jupyterlab compatibility
    "jupyter-lsp>=1.5.1,<2.0.0",  # Constrained for jupyterlab compatibility
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0,<4.0.0",
    "jupyter-lsp>=1.5.1,<2.0.0",
]