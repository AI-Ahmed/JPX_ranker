[project]
name = "jpx-ranker"
version = "0.1.0"
description = "JPX Tokyo Stock Exchange Prediction - Ranking Model"
requires-python = ">=3.10"
dependencies = [
    # Data manipulation and analysis
    # Note: Versions are flexible to work with Kaggle's pre-installed packages
    # Kaggle has: pandas 2.1.4, numpy 1.26.4, scipy 1.11.4 (transitive)
    "pandas>=2.1.0",
    "numpy>=1.24.0",  # Flexible: Kaggle has 1.26.4, compatible with our code
    
    # Environment variables
    "python-dotenv>=1.0.0",
    
    # Kaggle integration
    "kaggle>=1.6.0",
    "kagglehub>=0.3.0",
    
    # Parallel processing
    "pandarallel>=1.6.5",
    "feather-format",
    
    # Progress bars
    "tqdm>=4.65.0",
    
    # Statistical analysis
    # Note: statsmodels will use Kaggle's scipy 1.11.4 (transitive dependency)
    "statsmodels>=0.14.0",
    
    # Machine learning
    "scikit-learn>=1.2.2",  # Kaggle has 1.2.2
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.3.0",
    
    # Visualization
    # Note: Constrained to avoid conflicts with ydata-profiling (Kaggle pre-installed)
    "matplotlib>=3.7.0,<3.9",  # Kaggle has 3.7.5
    "seaborn>=0.12.0,<0.13",   # Kaggle has 0.12.2
    
    # Data serialization
    "pyarrow>=15.0.0",  # Kaggle has 15.0.2
    
    # Portfolio optimization
    "skfolio>=0.15.3",
    
    # Logging
    "loguru>=0.7.3",  # Kaggle has 0.7.2, we need >=0.7.3 (will upgrade)
]

[project.optional-dependencies]
dev = [
    # Jupyter notebook support
    # Note: In Kaggle notebooks, these are pre-installed
    # Only install locally for development
    "ipykernel>=6.25.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0,<4.0.0",  # Constrained for beatrix-jupyterlab compatibility
    "jupyter-lsp>=1.5.1,<2.0.0",  # Constrained for jupyterlab compatibility
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0,<4.0.0",
    "jupyter-lsp>=1.5.1,<2.0.0",
]