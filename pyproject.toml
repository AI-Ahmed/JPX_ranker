[project]
name = "jpx-ranker"
version = "0.1.0"
description = "JPX Tokyo Stock Exchange Prediction - Ranking Model"
requires-python = ">=3.10"
dependencies = [
    # Data manipulation and analysis
    # Constrained to work with CUDA/cuDF packages in Kaggle
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    
    # Environment variables
    "python-dotenv>=1.0.0",
    
    # Kaggle integration
    "kaggle>=1.6.0",
    "kagglehub>=0.3.0",
    
    # Parallel processing
    "pandarallel>=1.6.5",
    
    # Progress bars
    "tqdm>=4.65.0",
    
    # Statistical analysis
    "statsmodels>=0.14.0",
    
    # Machine learning
    "scikit-learn>=1.2.2",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.3.0",
    
    # Visualization
    # Constrained to work with ydata-profiling
    "matplotlib>=3.7.0,<3.9",
    "seaborn>=0.12.0,<0.13",
    
    # Data serialization
    # Constrained to work with apache-beam and cuDF
    "pyarrow>=15.0.0",
    
    # Portfolio optimization
    "skfolio>=0.15.3",
    
    # Logging
    "loguru>=0.7.3",
    
]

[project.optional-dependencies]
dev = [
    # Jupyter notebook support
    # Note: In Kaggle notebooks, these are pre-installed
    # Only install locally for development
    "ipykernel>=6.25.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0,<4.0.0",  # Constrained for beatrix-jupyterlab compatibility
    "jupyter-lsp>=1.5.1,<2.0.0",  # Constrained for jupyterlab compatibility
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0,<4.0.0",
    "jupyter-lsp>=1.5.1,<2.0.0",
]