[project]
name = "jpx-ranker"
version = "0.1.0"
description = "JPX Tokyo Stock Exchange Prediction - Ranking Model"
requires-python = ">=3.10"
dependencies = [
    # Data manipulation and analysis
    "pandas>=1.5.3",
    "numpy>=1.24.4,<1.26",
    # Environment variables
    "python-dotenv>=1.0.0",
    # Kaggle integration
    "kaggle>=1.6.0",
    "kagglehub>=0.3.0",
    # Parallel processing
    "pandarallel>=1.6.5",
    # Progress bars
    "tqdm>=4.65.0",
    # Statistical analysis
    "statsmodels>=0.14.0",
    # Machine learning
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.3.0",
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Data serialization
    "pyarrow>=14.0.0",
    "skfolio>=0.15.3",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    # Jupyter notebook support
    "ipykernel>=6.25.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

